name: Build itClass web dev image

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-dev.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/**'
      - 'lib/**'
      - 'web/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
  workflow_dispatch:
    inputs:
      publish_dev:
        description: 'Publish dev only after the 20261108 accounts/assessments backend is deployed'
        type: boolean
        default: false

concurrency:
  group: itclass-web-dev
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/xujia1990/itclass
  FLUTTER_VERSION: 3.47.2
  API_BASE_URL: https://api-dev.tw-onlineschool.com/app-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Flutter web
        run: >-
          flutter build web --release
          --dart-define=TWSCHOOL_API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Version the application entrypoint and assets
        run: |
          python3 - <<'PYTHON'
          import os
          import json
          import shutil
          from pathlib import Path
          bootstrap = Path('build/web/flutter_bootstrap.js')
          source = bootstrap.read_text()
          original = '"mainJsPath":"main.dart.js"'
          if original not in source:
              raise SystemExit('Flutter bootstrap entrypoint was not found')
          versioned = '"mainJsPath":"main.dart.js?v=' + os.environ['GITHUB_SHA'] + '"'
          source = source.replace(original, versioned)
          loader = '_flutter.loader.load({'
          if source.count(loader) != 1:
              raise SystemExit('Flutter loader configuration was not found')
          # The icon font is tree-shaken for each build. Give it (and the asset
          # manifests) a new URL so cached fonts cannot hide new UI icons.
          asset_base = 'releases/' + os.environ['GITHUB_SHA'] + '/'
          shutil.copytree(
              Path('build/web/assets'),
              Path('build/web') / asset_base / 'assets',
              dirs_exist_ok=True,
          )
          config = json.dumps({'assetBase': asset_base})
          source = source.replace(loader, loader + '\n  config: ' + config + ',')
          bootstrap.write_text(source)
          PYTHON

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Push image
        run: |
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Promote dev after backend migration
        if: ${{ vars.TWSCHOOL_ASSESSMENTS_20261108_READY == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_dev) }}
        run: |
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}:dev"
          docker push "${IMAGE_NAME}:dev"

      - name: Migration notice
        if: ${{ vars.TWSCHOOL_ASSESSMENTS_20261108_READY != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.publish_dev) }}
        run: echo '::notice::Commit image built. Deploy the 20261108 backend before promoting dev with publish_dev or TWSCHOOL_ASSESSMENTS_20261108_READY=true.'
